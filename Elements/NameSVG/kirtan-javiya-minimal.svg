<svg width="680" height="100" viewBox="0 0 680 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .name-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 46px;
        font-weight: 800;
        letter-spacing: 4px;
        fill: #0d1117;
      }
      .dot-accent {
        fill: #2fd8e5;
      }
      @media (prefers-color-scheme: dark) {
        .name-text { fill: #e6edf3; }
      }
    </style>
  </defs>

  <!-- First name: KIRTAN -->
  <text x="340" y="58" text-anchor="middle" class="name-text" opacity="0">
    <tspan>KIRTAN</tspan>
    <tspan dx="16"> JAVIYA</tspan>
    <animate attributeName="opacity" from="0" to="1" begin="0.2s" dur="0.7s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0,20" to="0,0" begin="0.2s" dur="0.7s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1" keyTimes="0;1"/>
  </text>

  <!-- Accent dot -->
  <circle cx="340" cy="82" r="3.5" class="dot-accent" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.9s" dur="0.4s" fill="freeze"/>
    <animate attributeName="r" from="0" to="3.5" begin="0.9s" dur="0.4s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1" keyTimes="0;1"/>
  </circle>

  <!-- Left accent line (draws from center dot outward) -->
  <line x1="340" y1="82" x2="340" y2="82" stroke-width="1.5" stroke-linecap="round" class="dot-accent" stroke="#2fd8e5" opacity="0">
    <animate attributeName="opacity" from="0" to="0.4" begin="1.2s" dur="0.5s" fill="freeze"/>
    <animate attributeName="x1" from="336" to="260" begin="1.2s" dur="0.5s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1" keyTimes="0;1"/>
  </line>

  <!-- Right accent line (draws from center dot outward) -->
  <line x1="340" y1="82" x2="340" y2="82" stroke-width="1.5" stroke-linecap="round" class="dot-accent" stroke="#2fd8e5" opacity="0">
    <animate attributeName="opacity" from="0" to="0.4" begin="1.2s" dur="0.5s" fill="freeze"/>
    <animate attributeName="x2" from="344" to="420" begin="1.2s" dur="0.5s" fill="freeze" calcMode="spline" keySplines="0.16 1 0.3 1" keyTimes="0;1"/>
  </line>
</svg>
