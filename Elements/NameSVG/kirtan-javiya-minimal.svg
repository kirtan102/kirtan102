<svg width="680" height="120" viewBox="0 0 680 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .name-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 46px;
        font-weight: 800;
        letter-spacing: 4px;
        fill: #0d1117;
      }
      .dot-accent { fill: #2fd8e5; }
      .url-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 2px;
        fill: #656d76;
      }
      .petal-a { fill: #d4587a; }
      .petal-b { fill: #c9446c; }
      .petal-c { fill: #e07090; }
