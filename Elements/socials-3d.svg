<svg width="680" height="60" viewBox="0 0 680 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      /* 3D Button Light Mode */
      .btn-shadow { fill: #d0d7de; }
      .btn-face { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.5; }
      .btn-text { fill: #1f2328; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 13.5px; font-weight: 600; }
      .icon-svg { fill: #1f2328; }
      .icon-blue { fill: #0a66c2; }
      
      /* 3D Button Dark Mode */
      @media (prefers-color-scheme: dark) {
        .btn-shadow { fill: #010409; }
        .btn-face { fill: #161b22; stroke: #30363d; }
        .btn-text { fill: #f0f6fc; }
        .icon-svg { fill: #f0f6fc; }
        .icon-blue { fill: #388bfd; }
      }
    </style>
  </defs>

  <g transform="translate(115, 4)">
    <!-- ═══ 1. LINKEDIN 3D BUTTON ═══ -->
    <a href="https://linkedin.com/in/kirtan-javiya" target="_blank">
      <g>
        <!-- 3D Base Shadow -->
        <rect x="0" y="4" width="140" height="42" rx="10" class="btn-shadow" />
        <!-- 3D Top Face -->
        <rect x="0" y="0" width="140" height="42" rx="10" class="btn-face" />
        <!-- Icon: LinkedIn -->
        <path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.75M6.46 10.9v8.37H9.25V10.9H6.46M7.86 6.88a1.47 1.47 0 1 0 0 2.94 1.47 1.47 0 0 0 0-2.94z" transform="translate(14, 11) scale(0.9)" class="icon-blue"/>
        <!-- Label -->
        <text x="46" y="26" class="btn-text">LinkedIn</text>
      </g>
    </a>

    <!-- ═══ 2. X (TWITTER) 3D BUTTON ═══ -->
    <a href="https://x.com/kirtan_javiya" target="_blank">
      <g transform="translate(155, 0)">
        <!-- 3D Base Shadow -->
        <rect x="0" y="4" width="140" height="42" rx="10" class="btn-shadow" />
        <!-- 3D Top Face -->
        <rect x="0" y="0" width="140" height="42" rx="10" class="btn-face" />
        <!-- Icon: X -->
        <path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z" transform="translate(16, 11) scale(0.85)" class="icon-svg"/>
        <!-- Label -->
        <text x="48" y="26" class="btn-text">X / Twitter</text>
      </g>
    </a>

    <!-- ═══ 3. EMAIL 3D BUTTON ═══ -->
    <a href="mailto:kirtanjaviyawork@gmail.com">
      <g transform="translate(310, 0)">
        <!-- 3D Base Shadow -->
        <rect x="0" y="4" width="140" height="42" rx="10" class="btn-shadow" />
        <!-- 3D Top Face -->
        <rect x="0" y="0" width="140" height="42" rx="10" class="btn-face" />
        <!-- Icon: Email Envelope -->
        <path d="M1.75 3h16.5c.966 0 1.75.784 1.75 1.75v10.5A1.75 1.75 0 0 1 18.25 17H1.75A1.75 1.75 0 0 1 0 15.25V4.75C0 3.784.784 3 1.75 3Zm16.5 1.5H1.75a.25.25 0 0 0-.25.25v.852l8.5 4.67 8.5-4.67V4.75a.25.25 0 0 0-.25-.25Zm.25 2.559-7.985 4.387a.75.75 0 0 1-.765 0L1.5 7.059v8.191c0 .138.112.25.25.25h16.5a.25.25 0 0 0 .25-.25V7.059Z" transform="translate(16, 11) scale(0.95)" class="icon-svg"/>
